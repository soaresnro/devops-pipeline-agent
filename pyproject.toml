[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devops-pipeline-agent"
version = "0.1.0"
description = "Agente conversacional self-service para criacao de pipelines CI/CD no Azure DevOps com deploy AKS+Helm+ACR"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Plataforma DevOps" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
    "langgraph>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
devops-agent = "devops_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/devops_agent/templates" = "devops_agent/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
