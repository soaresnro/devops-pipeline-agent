apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker-chart.fullname" . }}
  labels:
    app: {{ include "worker-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: {{ .Values.strategy.type }}

  selector:
    matchLabels:
      app: {{ include "worker-chart.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "worker-chart.fullname" . }}
        azure.workload.identity/use: "true"

    spec:

      serviceAccountName: sa-{{ include "worker-chart.fullname" . }}

      containers:
        - name: {{ include "worker-chart.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag é obrigatório" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}