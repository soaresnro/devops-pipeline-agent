image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

strategy:
  type: Recreate

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"

replicaCount: 1

autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: ""

workloadIdentity:
  enabled: false
  clientId: ""

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
